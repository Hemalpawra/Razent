# Supabase CLI configuration for Razent
# https://supabase.com/docs/guides/cli/config

[project]
project_id = "razent"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
bind_ip = "127.0.0.1"
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# Edge Functions configuration
[functions]
enabled = true

[functions.execute-agent-checkout]
verify_jwt = true

[functions.uap-verifier]
verify_jwt = false

[functions.x402-challenge]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[analytics]
enabled = true
port = 54327
backend = "postgres"
